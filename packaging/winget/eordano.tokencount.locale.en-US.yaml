ShortDescription: Lightning-fast offline token counter for 9 LLM tokenizers
Description: |-
  tokencount counts tokens in files or on stdin using the tokenizers of nine LLM
  families -- Claude, OpenAI, Gemini, DeepSeek, Qwen, MiniMax, Llama, Mistral and
  Grok. All nine tokenizer tables are compiled into the executable, so it runs
  fully offline with no runtime data files, no network access and sub-millisecond
  startup. It can count a single file, recurse a directory tree while honouring
  .gitignore, compare every model at once, or print a shareable URL that opens
  the same text in the tokencount web app.
