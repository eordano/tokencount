name: Test & Deploy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: E2E tests (dev server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - run: npm ci --ignore-scripts

      - run: npx playwright install --with-deps chromium

      - name: Install CJK fonts
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Get Chromium path
        id: browser-path
        run: echo "path=$(node -e "const {chromium}=require('@playwright/test');console.log(chromium.executablePath())")" >> "$GITHUB_OUTPUT"

      - name: Run E2E tests
        run: npx playwright test
        env:
          BROWSER_PATH: ${{ steps.browser-path.outputs.path }}

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots
          path: tests/screenshots/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: test-results/

  test-cli:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - run: npm ci --ignore-scripts

      - name: Build CLI
        run: node scripts/build-cli.mjs

      - name: Smoke test
        run: echo "Hello, world!" | ./dist/tokencount.mjs

      - name: Run CLI tests
        run: npm run test:cli

  test-bundle:
    name: E2E tests (offline bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - run: npm ci --ignore-scripts

      - run: npx playwright install --with-deps chromium

      - name: Install CJK fonts
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Build offline bundle
        run: node scripts/build-offline.mjs

      - name: Get Chromium path
        id: browser-path
        run: echo "path=$(node -e "const {chromium}=require('@playwright/test');console.log(chromium.executablePath())")" >> "$GITHUB_OUTPUT"

      - name: Run E2E tests against bundle
        run: npx playwright test --config playwright.bundle.config.js
        env:
          BROWSER_PATH: ${{ steps.browser-path.outputs.path }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-test-results
          path: test-results/

  # The Rust CLI is only ever compiled by release.yml, on a tag -- too late to
  # learn that build.rs or Cargo.lock broke. `cargo check` is cheap, and one
  # embedded table is enough to exercise the include_bytes! codegen on Windows,
  # where an interpolated OUT_DIR would be re-parsed as escape sequences.
  rust:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TOKEN_COUNT_MODELS: models
      # Only o200k_base.tiktoken is fetched here (3.4 MB, against ~90 MB for the
      # full set), so the build is deliberately partial. release.yml fetches all
      # eight and fails if any table is missing.
      TOKENCOUNT_ALLOW_PARTIAL: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Fetch one tokenizer table
        shell: bash
        run: node scripts/fetch-models.mjs "$TOKEN_COUNT_MODELS" --only openai

      - name: cargo check
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV
          cargo check --locked --all-targets

      - name: The generated table must reference OUT_DIR, never an absolute path
        shell: bash
        run: |
          set -euo pipefail
          gen="$(find target/debug/build -maxdepth 3 -name embedded_models.rs -print -quit)"
          [ -n "$gen" ] || { echo "::error::build.rs did not emit embedded_models.rs"; exit 1; }
          cat "$gen"
          grep -q 'Some(include_bytes!(concat!(env!("OUT_DIR")' "$gen"

  consistency:
    name: Version and pin consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Cargo.toml is the single source of truth for the version; these three
      # catch the drift that would otherwise surface as a failed release.
      - name: Check
        run: |
          set -euo pipefail
          node scripts/build-npm-packages.mjs --check
          node scripts/build-packaging-manifests.mjs --check
          node scripts/fetch-models.mjs --verify-pins

      - name: Launcher tests
        run: node npm/test/launcher.test.cjs

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, test-cli, test-bundle, rust, consistency]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install dependencies (skip browsers)
        run: npm ci --ignore-scripts

      - name: Build offline bundle
        run: node scripts/build-offline.mjs

      - name: Download test screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: screenshots
          path: tests/screenshots/

      - name: Generate screenshot viewer
        run: node scripts/build-screenshot-viewer.mjs

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          branch: gh-pages
          folder: .
          clean-exclude: pr-preview
