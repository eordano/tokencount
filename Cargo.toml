[package]
name = "tokencount"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
description = "Lightning-fast offline token counter for 9 LLM tokenizers"
license = "AGPL-3.0-only"
repository = "https://github.com/eordano/tokencount"
homepage = "https://tokencount.eordano.com"
readme = "README.md"
keywords = ["tokenizer", "llm", "token-count", "bpe", "cli"]
categories = ["command-line-utilities", "text-processing"]

publish = false

exclude = [
  "/.claude/",
  "/.github/",
  "/CLAUDE.md",
  "/CNAME",
  "/cli/",
  "/css/",
  "/docs/",
  "/flake.lock",
  "/flake.nix",
  "/index.html",
  "/js/",
  "/npm/",
  "/package-lock.json",
  "/package.json",
  "/packaging/",
  "/RELEASE-PACKAGING.md",
  "/playwright.bundle.config.js",
  "/playwright.config.js",
  "/scripts/",
  "/tests/",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
serde_json = "1"
fancy-regex = "0.19"
base64 = "0.23"
unicode-normalization = "0.1"

[build-dependencies]
serde_json = "1"
base64 = "0.23"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 16
panic = "abort"
