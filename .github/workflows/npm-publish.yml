name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.1)"
        required: true
        type: string
      dry_run:
        description: "Run pnpm publish --dry-run instead of publishing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}

jobs:
  platforms:
    name: Publish @tokencount/* platform packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      # An explicit version, because a re-run may check out a tag older than the
      # packageManager field; keep it equal to package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Resolve version and check it against the tag
        id: version
        run: |
          version="$(node scripts/build-npm-packages.mjs --print-version)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Preflight -- every package must already exist on the registry
        if: ${{ !inputs.dry_run }}
        run: |
          set -uo pipefail
          missing=""
          for name in $(node -p "require('./npm/lib/targets.json').targets.map(t => t.package).join(' ')") tokencount; do
            if ! pnpm view "$name" version >/dev/null 2>&1; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::these npm packages do not exist yet:$missing"
            cat >&2 <<'EOF'
          Trusted publishing (OIDC) can publish a new version of an existing
          package, but it cannot create one: the trusted-publisher setting lives
          on the package's own settings page, so the package has to exist first.

          One-time bootstrap, from a machine with an npm account:
            1. create the @tokencount organisation/scope on npmjs.com
            2. publish each name once with a granular access token
            3. on each package's Settings -> Trusted publisher, select this
               repository and the workflow .github/workflows/npm-publish.yml
            4. revoke the token

          RELEASE-PACKAGING.md has the exact commands.
          EOF
            exit 1
          fi

      - name: Wait for the release archives
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/release-artifacts
          # shellcheck disable=SC2016  # the backticks below are JS, not shell
          node -e '
            const { targets } = require("./npm/lib/targets.json");
            for (const t of targets) {
              console.log(`tokencount-${process.env.VERSION}-${t.rustTarget}.${t.archive}`);
            }
            console.log("SHA256SUMS");
          ' > /tmp/expected-assets
          # 120 x 30s = one hour. release.yml builds five targets from scratch
          # with lto = true and codegen-units = 16; the Windows leg in particular
          # is slow. Overshooting costs nothing, timing out costs a manual re-run.
          for attempt in $(seq 1 120); do
            gh release download "$TAG" --dir dist/release-artifacts \
              --pattern 'tokencount-*' --pattern 'SHA256SUMS' --clobber || true
            missing=""
            while read -r asset; do
              [ -f "dist/release-artifacts/$asset" ] || missing="$missing $asset"
            done < /tmp/expected-assets
            if [ -z "$missing" ]; then
              echo "all release assets present"
              exit 0
            fi
            echo "attempt $attempt/120: still waiting for:$missing"
            sleep 30
          done
          echo "::error::release $TAG still has no:$missing"
          cat >&2 <<EOF
          The Rust archives never appeared. Either release.yml has not run for
          $TAG, or it failed, or it is still going.

          Check the Release workflow for $TAG, then re-run this one by hand:
            Actions -> Publish to npm -> Run workflow -> tag: $TAG
          EOF
          exit 1

      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for archive in dist/release-artifacts/tokencount-*; do
            echo "verifying $archive"
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done

      - name: Stage npm packages
        run: node scripts/build-npm-packages.mjs --artifacts dist/release-artifacts

      - name: Test the launcher
        run: node npm/test/launcher.test.cjs

      - name: Smoke-test the binary being published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out="$(dist/npm/@tokencount/linux-x64/bin/tokencount --version)"
          echo "$out"
          [ "$out" = "tokencount $VERSION" ] || {
            echo "::error::staged linux-x64 binary reports '$out', expected 'tokencount $VERSION'"
            exit 1
          }

      - name: Publish platform packages
        run: |
          for dir in dist/npm/@tokencount/*; do
            # shellcheck disable=SC2016  # the backticks below are JS, not shell
            spec="$(node -e '
              const path = require("node:path");
              const m = require(path.resolve(process.argv[1], "package.json"));
              console.log(`${m.name}@${m.version}`);
            ' "$dir")"
            if pnpm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published, skipping"
              continue
            fi
            echo "publishing $spec"
            # shellcheck disable=SC2086  # DRY_RUN is a flag or empty, on purpose
            pnpm publish "$dir" --provenance --access public --no-git-checks $DRY_RUN
          done

  root:
    name: Publish tokencount
    needs: platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      # An explicit version, because a re-run may check out a tag older than the
      # packageManager field; keep it equal to package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Resolve version
        id: version
        run: echo "version=$(node scripts/build-npm-packages.mjs --print-version)" >> "$GITHUB_OUTPUT"

      - name: Wait for the platform packages to be resolvable
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for name in $(node -p "require('./npm/lib/targets.json').targets.map(t => t.package).join(' ')"); do
            for attempt in $(seq 1 30); do
              if pnpm view "$name@$VERSION" version >/dev/null 2>&1; then
                echo "$name@$VERSION is live"
                break
              fi
              if [ "$attempt" = "30" ]; then
                echo "::error::$name@$VERSION never appeared on the registry"
                exit 1
              fi
              sleep 10
            done
          done

      - name: Stage the root package
        run: node scripts/build-npm-packages.mjs --root-only

      - name: Publish
        run: |
          # shellcheck disable=SC2086  # DRY_RUN is a flag or empty, on purpose
          pnpm publish dist/npm/tokencount --provenance --access public --no-git-checks $DRY_RUN
